name: Web CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig.*'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Lint
      run: npm run lint
      
    - name: Typecheck & Build
      run: npm run build
      
    - name: Test
      run: npm run test:ci || echo "No tests configured or tests failed. Verify test command."
